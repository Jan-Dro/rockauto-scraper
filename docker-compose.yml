version: "3.9"

services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rockauto-closeout-watcher
    restart: unless-stopped

    # Load secrets from .env file (copy from .env.example)
    env_file:
      - .env

    volumes:
      # Persist seen items and logs between container restarts
      - ./data:/app/data
      # Allow live config edits without rebuilding the image
      - ./config.yaml:/app/config.yaml:ro
      # Mount sample files for calibration runs
      - ./samples:/app/samples:ro

    # Uncomment to override the default watch mode:
    # command: ["python", "monitor.py", "--once"]

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
