vehicle:
  year_range: "2009-2020"
  make: "Nissan"
  model: "370Z"
  brake_package: "Sport Akebono"

rockauto:
  # source_mode: "rss" or "html"
  source_mode: "html"
  # RockAuto closeout RSS URL (leave empty if using html mode)
  rss_url: ""
  # Direct HTML page URL
  page_url: "https://www.rockauto.com/closeouts/?carcode=3341239"
  request_timeout: 15
  user_agent: "Mozilla/5.0 rockauto-closeout-watcher"

monitor:
  interval_minutes: 30
  dry_run: false
  debug_matching: true

matching:
  required_keywords:
    - caliper

  front_keywords:
    - front

  right_keywords:
    - right
    - front right
    - right front
    - passenger
    - passenger side
    - RH

  sport_keywords:
    - sport
    - akebono
    - nismo
    - nismo tech
    - sport tech
    - touring sport
    - 4 piston
    - 4-piston
    - 4-piston caliper
    - 4 piston caliper
    - with sport brakes
    - w/ sport brakes

  reject_keywords:
    - rear
    - rear left
    - rear right
    - base model
    - base brakes
    - standard brakes
    - standard duty
    - w/o sport
    - without sport
    - 2-piston
    - 2 piston
    - 1-piston
    - 1 piston
    - single piston
    - one piston
    - iron caliper
    - iron calipers

discord:
  # Resolved from the DISCORD_WEBHOOK_URL environment variable at runtime
  webhook_url: "${DISCORD_WEBHOOK_URL}"

storage:
  seen_items_file: "data/seen_items.json"
